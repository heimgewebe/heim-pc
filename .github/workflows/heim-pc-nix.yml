name: heim-pc-nix

on:
  push:
    branches: [ main ]
  merge_group:
    types: [checks_requested]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI_NIX_CACHE_URL: https://commonserver.tail6dbb90.ts.net:10000/nix-cache
  CI_NIX_CACHE_PUBLIC_KEY: heim-pc-ci-cache-20260923-1:fDffoLuvBMGVo8JKRR7uY7EmJPawIsKXuB5OBswBdIo=

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      control_changed: ${{ steps.control.outputs.control_changed }}
      nix_changed: ${{ steps.changes.outputs.nix_changed }}
      admission: ${{ steps.admission.outputs.admission }}
    env:
      EXPECTED_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SOURCE_REVISION: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.event.before }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Checkout exact source revision for change detection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify detector source identity
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_REVISION"
          test -z "$(git status --porcelain)"

      - name: Detect Nix CI control-plane changes independently
        id: control
        run: |
          control_changed=true
          if printf '%s\n' "$BASE_SOURCE_REVISION" | grep -Eq '^[0-9a-f]{40}$' \
              && printf '%s\n' "$EXPECTED_SOURCE_REVISION" | grep -Eq '^[0-9a-f]{40}$' \
              && git cat-file -e "$BASE_SOURCE_REVISION^{commit}" \
              && git cat-file -e "$EXPECTED_SOURCE_REVISION^{commit}"; then
            case "$EVENT_NAME" in
              pull_request) revision_range="$BASE_SOURCE_REVISION...$EXPECTED_SOURCE_REVISION" ;;
              push|merge_group) revision_range="$BASE_SOURCE_REVISION..$EXPECTED_SOURCE_REVISION" ;;
              *) revision_range="" ;;
            esac
            if test -n "$revision_range"; then
              if git diff --quiet --no-renames "$revision_range" -- \
                  .github/workflows/heim-pc-nix.yml scripts/ci/nix_changed.py; then
                control_changed=false
              else
                status=$?
                if test "$status" -ne 1; then
                  printf 'control-plane comparison failed with status %s; forcing Nix CI\n' "$status" >&2
                fi
              fi
            fi
          fi
          printf 'control_changed=%s\n' "$control_changed" >> "$GITHUB_OUTPUT"

      - name: Detect Nix-relevant changes with trusted base detector
        id: changes
        if: steps.control.outputs.control_changed == 'false'
        run: |
          detector="$RUNNER_TEMP/heim-pc-nix-changed.py"
          git show "${BASE_SOURCE_REVISION}:scripts/ci/nix_changed.py" > "$detector"
          python3 "$detector" \
            --event-name "$EVENT_NAME" \
            --base "$BASE_SOURCE_REVISION" \
            --head "$EXPECTED_SOURCE_REVISION" \
            >> "$GITHUB_OUTPUT"

      - name: Validate detector outputs
        env:
          CONTROL_CHANGED: ${{ steps.control.outputs.control_changed }}
          NIX_CHANGED: ${{ steps.changes.outputs.nix_changed }}
        run: |
          case "$CONTROL_CHANGED" in
            true|false) ;;
            *)
              printf 'invalid control_changed output: %q\n' "$CONTROL_CHANGED" >&2
              exit 1
              ;;
          esac
          if test "$CONTROL_CHANGED" = false; then
            case "$NIX_CHANGED" in
              true|false) ;;
              *)
                printf 'invalid nix_changed output: %q\n' "$NIX_CHANGED" >&2
                exit 1
                ;;
            esac
          fi

      # Admission is not integration evidence: the mandatory ALLGREEN queue
      # must still build the actual group. Before removing the queue or adding
      # bypass actors, restore full PR builds and revalidate open PR checks.
      - name: Select lightweight PR queue admission
        id: admission
        if: >-
          github.event_name == 'pull_request' &&
          steps.control.outputs.control_changed == 'false' &&
          steps.changes.outputs.nix_changed == 'true'
        shell: python
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          import re
          import subprocess

          repo = os.environ.get("REPOSITORY")
          base, head = os.environ.get("BASE_SHA", ""), os.environ.get("HEAD_SHA", "")

          def api(path):
              return json.loads(subprocess.run(
                  ["gh", "api", path], check=True, capture_output=True,
                  text=True, timeout=10,
              ).stdout)

          def admits():
              if not (
                  os.environ.get("EVENT_NAME") == "pull_request"
                  and repo == "heimgewebe/heim-pc"
                  and os.environ.get("HEAD_REPOSITORY") == repo
                  and os.environ.get("BASE_REF") == "main"
                  and re.fullmatch(r"[0-9a-f]{40}", base)
                  and re.fullmatch(r"[0-9a-f]{40}", head)
                  and base != head
              ):
                  return False
              # A stale base or changed CI controls never grants admission.
              if api(f"repos/{repo}/git/ref/heads/main")["object"]["sha"] != base:
                  return False
              if subprocess.run(
                  ["git", "diff", "--quiet", "--no-renames", base, head, "--",
                   ".github/workflows", ".github/grabowski-required-checks.json",
                   "scripts/ci", "tests/test_ci_nix_reuse.py", "tests/test_nix_changed.py"],
                  check=False, capture_output=True, timeout=10,
              ).returncode != 0:
                  return False
              rules = api(f"repos/{repo}/rules/branches/main?per_page=100")
              if not isinstance(rules, list) or not 0 < len(rules) < 100:
                  return False
              queues = [r for r in rules if r.get("type") == "merge_queue"]
              required = [r for r in rules if r.get("type") == "required_status_checks"]
              if len(queues) != 1 or len(required) != 1:
                  return False
              queue, checks = queues[0], required[0]
              if any(
                  r.get("ruleset_source_type") != "Repository"
                  or r.get("ruleset_source") != repo
                  or r.get("ruleset_id") != 21590094
                  for r in (queue, checks)
              ):
                  return False
              qp, cp = queue["parameters"], checks["parameters"]
              return (
                  qp.get("grouping_strategy") == "ALLGREEN"
                  and qp.get("merge_method") == "MERGE"
                  and cp.get("strict_required_status_checks_policy") is True
                  and cp.get("do_not_enforce_on_create") is False
                  and all(
                      {"context": name, "integration_id": 15368}
                      in cp["required_status_checks"]
                      for name in ("validate", "guard / verify", "smoke / verify", "live-system")
                  )
              )

          admission = False
          try:
              admission = admits()
          except (OSError, subprocess.SubprocessError, ValueError, TypeError, KeyError, AttributeError):
              # Missing or ambiguous evidence means the normal full build.
              pass
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"admission={'true' if admission else 'false'}", file=output)
          print("PR queue admission only; full build required in merge_group"
                if admission else "No queue admission proof; normal build policy")


  nix:
    needs: detect
    # Historical storage/ISO/agent-zone proof matrix is optional. The actual
    # deployed host and both headless systemd VM proofs run in live-system.
    # Keep these legacy builds manually runnable without doubling routine CI.
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Runs 39459985355 (90m) and 41052537896 (120m) exhausted the
    # heavy build budget; the latter also hit Python thread exhaustion.
    # Run 41141193775 exhausted 240m while Node/V8 remained unbuilt.
    # Keep all closure, VM and signature gates; use the 4-vCPU public runner.
    timeout-minutes: 360
    env:
      EXPECTED_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      # Fresh derivations: the CI evaluator cache retained an unrealized drv
      # after flake check --no-build (run 34050033409). No gate is weakened.
      NIX_CONFIG: "eval-cache = false"
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify source identity
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_REVISION"
          test -z "$(git status --porcelain)"
          printf 'SOURCE_REVISION=%s\n' "$EXPECTED_SOURCE_REVISION"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            require-sigs = true
            fallback = true
            # Configure the Nix daemon, not only the client NIX_CONFIG.
            # Shared GitHub runners cannot sustain unbounded parallel builders.
            max-jobs = 1
            cores = 4
            extra-substituters = https://commonserver.tail6dbb90.ts.net:10000/nix-cache
            extra-trusted-public-keys = heim-pc-ci-cache-20260923-1:fDffoLuvBMGVo8JKRR7uY7EmJPawIsKXuB5OBswBdIo=

      # The hosted Nix daemon set RLIMIT_STACK=64 MiB, so each i686 pthread
      # reserved 64 MiB of the 32-bit address space and filelock's 100-thread
      # test ran out around thread 61. The native 8-MiB limit passed all 149
      # Filelock tests on heim-pc. Change only this ephemeral CI runner.
      - name: Set CI Nix daemon stack to 8 MiB
        run: |
          set -euo pipefail
          sudo systemctl cat nix-daemon.service >/dev/null
          sudo install -d -m 0755 /etc/systemd/system/nix-daemon.service.d
          printf '[Service]\nLimitSTACK=8M\n' | \
            sudo tee /etc/systemd/system/nix-daemon.service.d/20-heim-pc-ci-thread-stack.conf >/dev/null
          sudo systemctl daemon-reload
          sudo systemctl restart nix-daemon.service
          test "$(systemctl show --value --property=LimitSTACK nix-daemon.service)" = 8388608
          printf 'CI_NIX_DAEMON_STACK_BYTES=8388608\n'

      - name: Check canonical lock projection
        run: python3 scripts/ci/check_flake_lock.py

      - name: Report CI-only signed-cache trust
        run: |
          set -euo pipefail
          nix --version
          nix config show | grep -E '^(substituters|trusted-public-keys|require-sigs|fallback|max-jobs|cores) ='
          test "$(nix config show | sed -n 's/^max-jobs = //p')" = 1
          test "$(nix config show | sed -n 's/^cores = //p')" = 4
          # An HTTP health.txt 200 does not establish a valid Nix binary cache.
          # Do not conflate protocol metadata with trusted NAR signatures or
          # availability of the expensive Ollama/CUDA derivations.
          cache_info="$(mktemp "$RUNNER_TEMP/heim-pc-ci-cache-info.XXXXXX")"
          trap 'rm -f "$cache_info"' EXIT
          if curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
              --max-filesize 4096 "$CI_NIX_CACHE_URL/nix-cache-info" > "$cache_info" \
              && awk 'BEGIN { n=0; ok=1 } { c=index($0, ":"); if (c && substr($0, 1, c-1) == "StoreDir") { n++; v=substr($0, c+1); sub(/^[[:space:]]+/, "", v); sub(/[[:space:]]+$/, "", v); if (v != "/nix/store") ok=0 } } END { exit !(n == 1 && ok) }' "$cache_info"; then
            printf 'CI_NIX_CACHE_PROTOCOL=available; signed-output availability is not established\n'
          else
            printf 'CI_NIX_CACHE_PROTOCOL=unavailable; fallback=true keeps the local build path authoritative\n'
          fi

      - name: Evaluate complete flake without building checks
        run: nix flake check --no-build --no-update-lock-file --print-build-logs

      - name: Prove evaluated Heim-PC contracts
        run: >-
          nix build --no-link --no-update-lock-file --print-out-paths --print-build-logs
          .#checks.x86_64-linux.profile-contract
          .#checks.x86_64-linux.host-protection-contract
          .#checks.x86_64-linux.recovery-readiness-contract
          .#checks.x86_64-linux.intentional-break-rejected
          .#checks.x86_64-linux.agent-zone-contract

      # Fail early if the actual sandboxed builder did not inherit the
      # bounded stack. Then exercise 100 *simultaneous* i686 threads before
      # the unchanged complete Filelock installCheck and every other gate.
      - name: Verify i686 Nix builder stack and 100 concurrent threads
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/i686-nix-stack-contract.nix" <<'NIX'
          let
            f = builtins.getFlake (toString ./.);
            p = f.nixosConfigurations.heim-pc.pkgs;
            py32 = p.pkgsi686Linux.python3;
          in p.runCommand "heim-pc-ci-i686-stack-contract-v1" {
            nativeBuildInputs = [ py32 ];
          } ''
            set -e
            stack="$(ulimit -s)"
            echo "I686_NIX_BUILDER_STACK_KIB=$stack"
            test "$stack" = 8192
            ${py32}/bin/python3 - <<'PY'
          import threading
          gate = threading.Event()
          threads = [threading.Thread(target=gate.wait) for _ in range(100)]
          started = []
          try:
              for thread in threads:
                  thread.start()
                  started.append(thread)
              print("I686_CONCURRENT_THREADS", len(started), flush=True)
          finally:
              gate.set()
              for thread in started:
                  thread.join()
          PY
            touch "$out"
          ''
          NIX
          nix build --impure --no-link --no-update-lock-file --print-out-paths --print-build-logs \
            --expr "$(cat "$RUNNER_TEMP/i686-nix-stack-contract.nix")"

      - name: Prebuild i686 filelock threading tests
        run: >-
          nix build --no-link --no-update-lock-file --print-out-paths --print-build-logs
          .#nixosConfigurations.heim-pc.pkgs.pkgsi686Linux.python313Packages.filelock

      - name: Record heavy-derivation substitution plan
        run: |
          set -o pipefail
          nix build --dry-run --no-link --no-update-lock-file             .#packages.x86_64-linux.physical-gate-proprietary-system             2>&1 | tee "$RUNNER_TEMP/heim-pc-ci-cache-dry-run.log"
          grep -E 'ollama-0\.32\.3|llama-cpp-9190'             "$RUNNER_TEMP/heim-pc-ci-cache-dry-run.log" || true

      - name: Build storage, VM and physical-gate closures
        run: >-
          nix build --no-link --no-update-lock-file --print-out-paths --print-build-logs
          .#nixosConfigurations.heim-pc-storage-target.config.system.build.toplevel
          .#nixosConfigurations.heim-pc-vm.config.system.build.toplevel
          .#packages.x86_64-linux.physical-gate-proprietary-system
          .#packages.x86_64-linux.physical-gate-open-system

      - name: Build live-gate and inventory ISOs
        run: >-
          nix build --no-link --no-update-lock-file --print-out-paths --print-build-logs
          .#packages.x86_64-linux.physical-gate-live-proprietary-iso
          .#packages.x86_64-linux.physical-gate-live-open-iso
          .#packages.x86_64-linux.physical-gate-live-inventory-iso

      - name: Build no-IP agent-zone closures
        run: >-
          nix build --no-link --no-update-lock-file --print-out-paths --print-build-logs
          .#packages.x86_64-linux.agent-microvm
          .#packages.x86_64-linux.agent-vsock-proof-microvm
          .#packages.x86_64-linux.trust-zone-host-system

      - name: Run scoped VM checks
        run: >-
          nix build --no-link --no-update-lock-file --print-out-paths --print-build-logs
          .#checks.x86_64-linux.integration
          .#checks.x86_64-linux.host-protection
          .#checks.x86_64-linux.firstboot-credentials
          .#checks.x86_64-linux.trust-zones

      - name: Prove untrusted signatures are rejected by substitution
        run: bash scripts/ci/check_nix_cache_signature_rejection.sh

  live-system:
    needs: detect
    permissions:
      contents: read
      actions: read
    # Always report this tracked check. Detection errors force the real build;
    # a proven documentation-only change may omit expensive realization.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      EXPECTED_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      NIX_CONFIG: "eval-cache = false"
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify source identity
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_REVISION"
          test -z "$(git status --porcelain)"
          printf 'SOURCE_REVISION=%s\n' "$EXPECTED_SOURCE_REVISION"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            require-sigs = true
            fallback = true
            # Configure the Nix daemon, not only the client NIX_CONFIG.
            # Shared GitHub runners cannot sustain unbounded parallel builders.
            max-jobs = 1
            cores = 4
            extra-substituters = https://commonserver.tail6dbb90.ts.net:10000/nix-cache
            extra-trusted-public-keys = heim-pc-ci-cache-20260923-1:fDffoLuvBMGVo8JKRR7uY7EmJPawIsKXuB5OBswBdIo=

      # The hosted Nix daemon set RLIMIT_STACK=64 MiB, so each i686 pthread
      # reserved 64 MiB of the 32-bit address space and filelock's 100-thread
      # test ran out around thread 61. The native 8-MiB limit passed all 149
      # Filelock tests on heim-pc. Change only this ephemeral CI runner.
      - name: Set CI Nix daemon stack to 8 MiB
        run: |
          set -euo pipefail
          sudo systemctl cat nix-daemon.service >/dev/null
          sudo install -d -m 0755 /etc/systemd/system/nix-daemon.service.d
          printf '[Service]\nLimitSTACK=8M\n' | \
            sudo tee /etc/systemd/system/nix-daemon.service.d/20-heim-pc-ci-thread-stack.conf >/dev/null
          sudo systemctl daemon-reload
          sudo systemctl restart nix-daemon.service
          test "$(systemctl show --value --property=LimitSTACK nix-daemon.service)" = 8388608
          printf 'CI_NIX_DAEMON_STACK_BYTES=8388608\n'

      - name: Check canonical lock projection
        run: python3 scripts/ci/check_flake_lock.py

      - name: Report CI-only signed-cache trust
        run: |
          set -euo pipefail
          nix --version
          nix config show | grep -E '^(substituters|trusted-public-keys|require-sigs|fallback|max-jobs|cores) ='
          test "$(nix config show | sed -n 's/^max-jobs = //p')" = 1
          test "$(nix config show | sed -n 's/^cores = //p')" = 4
          # An HTTP health.txt 200 does not establish a valid Nix binary cache.
          # Do not conflate protocol metadata with trusted NAR signatures or
          # availability of the expensive Ollama/CUDA derivations.
          cache_info="$(mktemp "$RUNNER_TEMP/heim-pc-ci-cache-info.XXXXXX")"
          trap 'rm -f "$cache_info"' EXIT
          if curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
              --max-filesize 4096 "$CI_NIX_CACHE_URL/nix-cache-info" > "$cache_info" \
              && awk 'BEGIN { n=0; ok=1 } { c=index($0, ":"); if (c && substr($0, 1, c-1) == "StoreDir") { n++; v=substr($0, c+1); sub(/^[[:space:]]+/, "", v); sub(/[[:space:]]+$/, "", v); if (v != "/nix/store") ok=0 } } END { exit !(n == 1 && ok) }' "$cache_info"; then
            printf 'CI_NIX_CACHE_PROTOCOL=available; signed-output availability is not established\n'
          else
            printf 'CI_NIX_CACHE_PROTOCOL=unavailable; fallback=true keeps the local build path authoritative\n'
          fi


      - name: Evaluate live trust and lifecycle contracts
        run: |
          nix eval --no-update-lock-file --raw .#checks.x86_64-linux.supply-chain-trust.drvPath
          nix eval --no-update-lock-file --raw .#checks.x86_64-linux.nix-lifecycle-contract.drvPath

      - name: Select exact merge-group build reuse
        id: reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: python
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref }}
          HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          import re
          import subprocess

          def api(path):
              return json.loads(subprocess.run(
                  ["gh", "api", path], check=True, capture_output=True,
                  text=True, timeout=10,
              ).stdout)

          def complete_inventory(response, key):
              rows = response[key]
              if (not isinstance(rows, list) or type(response["total_count"]) is not int
                      or response["total_count"] != len(rows)):
                  raise ValueError("incomplete Actions inventory")
              return rows

          def full_group(repo, sha):
              # Retired queue refs are found by exact SHA at repository level.
              runs = complete_inventory(api(
                  f"repos/{repo}/actions/runs?head_sha={sha}&per_page=30"
              ), "workflow_runs")
              matches = [
                  r for r in runs
                  if r.get("head_sha") == sha
                  and (r.get("repository") or {}).get("full_name") == repo
                  and (r.get("head_repository") or {}).get("full_name") == repo
                  and r.get("event") == "merge_group"
                  and r.get("workflow_id") == 351684660
                  and r.get("path") == ".github/workflows/heim-pc-nix.yml"
                  and r.get("head_branch", "").startswith("gh-readonly-queue/main/")
              ]
              if len(matches) != 1 or not (
                  matches[0].get("status") == "completed"
                  and matches[0].get("conclusion") == "success"
              ):
                  return False
              run_id, attempt = matches[0]["id"], matches[0]["run_attempt"]
              if any(type(n) is not int or n < 1 for n in (run_id, attempt)):
                  return False
              jobs = complete_inventory(api(
                  f"repos/{repo}/actions/runs/{run_id}/attempts/{attempt}/jobs?per_page=100"
              ), "jobs")
              if sorted(j.get("name") for j in jobs) != ["detect", "live-system", "nix"]:
                  return False
              for job in jobs:
                  if not (
                      job.get("run_id") == run_id and job.get("head_sha") == sha
                      and job.get("run_attempt") == attempt
                      and job.get("status") == "completed"
                  ):
                      return False
                  if job["name"] == "nix":
                      if job.get("conclusion") != "skipped":
                          return False
                      continue
                  if job.get("conclusion") != "success":
                      return False
                  if job["name"] == "live-system":
                      for name in (
                          "Verify source identity",
                          "Check canonical lock projection",
                          "Evaluate live trust and lifecycle contracts",
                          "Build deployed live closure and execute both systemd VM proofs",
                      ):
                          steps = [s for s in job["steps"] if s.get("name") == name]
                          if len(steps) != 1 or not (
                              steps[0].get("status") == "completed"
                              and steps[0].get("conclusion") == "success"
                          ):
                              return False
              print(f"Reusing complete merge-group live-system build: run {run_id} attempt {attempt} for {sha}")
              return True

          reuse = False
          repo, sha = os.environ["REPOSITORY"], os.environ["HEAD_SHA"]
          if (
              os.environ["EVENT_NAME"] == "push" and repo == "heimgewebe/heim-pc"
              and os.environ["REF_NAME"] == "refs/heads/main" and re.fullmatch(r"[0-9a-f]{40}", sha)
          ):
              try:
                  reuse = full_group(repo, sha)
              except (OSError, subprocess.SubprocessError, ValueError, TypeError, KeyError, AttributeError):
                  # No complete proof means the normal full build, never a skip.
                  pass
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"reuse={'true' if reuse else 'false'}", file=output)
          print(f"Exact merge-group build reuse: {reuse}")

      - name: Build deployed live closure and execute both systemd VM proofs
        if: >-
          steps.reuse.outputs.reuse != 'true' &&
          (needs.detect.result != 'success' || needs.detect.outputs.admission != 'true') &&
          (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
          (needs.detect.result != 'success' ||
           needs.detect.outputs.control_changed != 'false' ||
           needs.detect.outputs.nix_changed != 'false')
        run: |
          set -euo pipefail
          nix build --no-link --no-update-lock-file --print-out-paths --print-build-logs \
            .#nixosConfigurations.heim-pc-seagate-grabowski-headless-candidate.config.system.build.toplevel \
            .#checks.x86_64-linux.supply-chain-trust \
            .#checks.x86_64-linux.nix-lifecycle-contract \
            .#packages.x86_64-linux.grabowski-headless-systemd-vm-proof \
            .#packages.x86_64-linux.nixer-headless-systemd-vm-proof
          # Verify the actual realized physical-host unit graph. systemd-analyze
          # can exit zero after deleting a job to break an ordering cycle;
          # the old thermal unit was enabled but silently skipped at boot.
          closure="$(nix eval --no-update-lock-file --raw .#nixosConfigurations.heim-pc-seagate-grabowski-headless-candidate.config.system.build.toplevel.outPath)"
          test -e "$closure/etc/systemd/system/multi-user.target.wants/heim-pc-thermal-mitigation.service"
          # Prove the actual deployed profile includes the SSH clipboard integration.
          for command in tmux tmux-autocopy-watch omnicopy copy-off; do
            test -x "$closure/sw/bin/$command"
          done
          test -s "$closure/etc/tmux.conf"
          test -s "$closure/etc/heim-pc/tmux-autocopy.conf"
          test -e "$closure/etc/systemd/user/heim-pc-tmux-autocopy-migration.service"
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          LC_ALL=C SYSTEMD_LOG_LEVEL=info SYSTEMD_UNIT_PATH="$closure/etc/systemd/system" \
            "$closure/sw/bin/systemd-analyze" --man=no --generators=no verify \
            multi-user.target graphical.target heim-pc-thermal-mitigation.service >"$log" 2>&1 || { cat "$log"; exit 1; }
          cat "$log"
          if grep -Ei 'ordering cycle|deleted to break.*cycle|cyclic ordering' "$log"; then
            exit 1
          fi
