name: heim-pc-nix

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI_NIX_CACHE_URL: https://commonserver.tail6dbb90.ts.net:10000/nix-cache
  CI_NIX_CACHE_PUBLIC_KEY: heim-pc-ci-cache-20260923-1:fDffoLuvBMGVo8JKRR7uY7EmJPawIsKXuB5OBswBdIo=

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      control_changed: ${{ steps.control.outputs.control_changed }}
      nix_changed: ${{ steps.changes.outputs.nix_changed }}
    env:
      EXPECTED_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SOURCE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Checkout exact source revision for change detection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify detector source identity
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_REVISION"
          test -z "$(git status --porcelain)"

      - name: Detect Nix CI control-plane changes independently
        id: control
        run: |
          control_changed=true
          if printf '%s\n' "$BASE_SOURCE_REVISION" | grep -Eq '^[0-9a-f]{40}$' \
              && printf '%s\n' "$EXPECTED_SOURCE_REVISION" | grep -Eq '^[0-9a-f]{40}$' \
              && git cat-file -e "$BASE_SOURCE_REVISION^{commit}" \
              && git cat-file -e "$EXPECTED_SOURCE_REVISION^{commit}"; then
            case "$EVENT_NAME" in
              pull_request) revision_range="$BASE_SOURCE_REVISION...$EXPECTED_SOURCE_REVISION" ;;
              push) revision_range="$BASE_SOURCE_REVISION..$EXPECTED_SOURCE_REVISION" ;;
              *) revision_range="" ;;
            esac
            if test -n "$revision_range"; then
              if git diff --quiet --no-renames "$revision_range" -- \
                  .github/workflows/heim-pc-nix.yml scripts/ci/nix_changed.py; then
                control_changed=false
              else
                status=$?
                if test "$status" -ne 1; then
                  printf 'control-plane comparison failed with status %s; forcing Nix CI\n' "$status" >&2
                fi
              fi
            fi
          fi
          printf 'control_changed=%s\n' "$control_changed" >> "$GITHUB_OUTPUT"

      - name: Detect Nix-relevant changes with trusted base detector
        id: changes
        if: steps.control.outputs.control_changed == 'false'
        run: |
          detector="$RUNNER_TEMP/heim-pc-nix-changed.py"
          git show "${BASE_SOURCE_REVISION}:scripts/ci/nix_changed.py" > "$detector"
          python3 "$detector" \
            --event-name "$EVENT_NAME" \
            --base "$BASE_SOURCE_REVISION" \
            --head "$EXPECTED_SOURCE_REVISION" \
            >> "$GITHUB_OUTPUT"

      - name: Validate detector outputs
        env:
          CONTROL_CHANGED: ${{ steps.control.outputs.control_changed }}
          NIX_CHANGED: ${{ steps.changes.outputs.nix_changed }}
        run: |
          case "$CONTROL_CHANGED" in
            true|false) ;;
            *)
              printf 'invalid control_changed output: %q\n' "$CONTROL_CHANGED" >&2
              exit 1
              ;;
          esac
          if test "$CONTROL_CHANGED" = false; then
            case "$NIX_CHANGED" in
              true|false) ;;
              *)
                printf 'invalid nix_changed output: %q\n' "$NIX_CHANGED" >&2
                exit 1
                ;;
            esac
          fi

  nix:
    needs: detect
    if: >-
      always() &&
      (needs.detect.result != 'success' ||
       needs.detect.outputs.control_changed != 'false' ||
       needs.detect.outputs.nix_changed != 'false')
    runs-on: ubuntu-latest
    # PR233 run 39459985355 reached the 90-minute cap during ISO builds.
    # Keep every mandatory closure, VM and signature check in this job.
    timeout-minutes: 120
    env:
      EXPECTED_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      # Fresh derivations: the CI evaluator cache retained an unrealized drv
      # after flake check --no-build (run 34050033409). No gate is weakened.
      NIX_CONFIG: "eval-cache = false"
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify source identity
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_REVISION"
          test -z "$(git status --porcelain)"
          printf 'SOURCE_REVISION=%s\n' "$EXPECTED_SOURCE_REVISION"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            require-sigs = true
            fallback = true
            extra-substituters = https://commonserver.tail6dbb90.ts.net:10000/nix-cache
            extra-trusted-public-keys = heim-pc-ci-cache-20260923-1:fDffoLuvBMGVo8JKRR7uY7EmJPawIsKXuB5OBswBdIo=

      - name: Report CI-only signed-cache trust
        run: |
          set -euo pipefail
          nix --version
          nix config show | grep -E '^(substituters|trusted-public-keys|require-sigs|fallback) ='
          # An HTTP health.txt 200 does not establish a valid Nix binary cache.
          # Do not conflate protocol metadata with trusted NAR signatures or
          # availability of the expensive Ollama/CUDA derivations.
          cache_info="$(mktemp "$RUNNER_TEMP/heim-pc-ci-cache-info.XXXXXX")"
          trap 'rm -f "$cache_info"' EXIT
          if curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
              --max-filesize 4096 "$CI_NIX_CACHE_URL/nix-cache-info" > "$cache_info" \
              && awk 'BEGIN { n=0; ok=1 } { c=index($0, ":"); if (c && substr($0, 1, c-1) == "StoreDir") { n++; v=substr($0, c+1); sub(/^[[:space:]]+/, "", v); sub(/[[:space:]]+$/, "", v); if (v != "/nix/store") ok=0 } } END { exit !(n == 1 && ok) }' "$cache_info"; then
            printf 'CI_NIX_CACHE_PROTOCOL=available; signed-output availability is not established\n'
          else
            printf 'CI_NIX_CACHE_PROTOCOL=unavailable; fallback=true keeps the local build path authoritative\n'
          fi

      # Nix flake.lock equality alone is not independent source=NAR evidence.
      # Fetch the immutable upstream commit directly (not from this flake's
      # lock) and recompute its NAR digest before any expensive closure builds.
      - name: Independently rehash pinned Nixer GitHub source
        run: |
          set -euo pipefail
          pins="$(python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          contract = json.loads(Path('nixos/production/trust-contract-v1.json').read_text())
          lock = json.loads(Path('flake.lock').read_text())
          pinned = contract['inputs']['nixer']
          node = lock['nodes'][pinned['lock_node']]
          revision = pinned['required_revision']
          nar_hash = pinned['required_nar_hash']
          if not re.fullmatch(r'[0-9a-f]{40}', revision):
              raise SystemExit('invalid pinned Nixer revision')
          if not re.fullmatch(r'sha256-[A-Za-z0-9+/]{43}=', nar_hash):
              raise SystemExit('invalid pinned Nixer NAR digest')
          source = {'type': 'github', 'owner': 'heimgewebe', 'repo': 'nixer', 'rev': revision}
          locked = node['locked']
          if node['original'] != source or any(locked.get(k) != v for k, v in source.items()):
              raise SystemExit('Nixer lock origin/commit differs from reviewed source')
          if locked.get('narHash') != nar_hash:
              raise SystemExit('Nixer lock NAR differs from reviewed contract')
          if lock['nodes']['root']['inputs'].get('nixer') != pinned['lock_node']:
              raise SystemExit('root Nixer lock edge differs from reviewed contract')
          runtime = pinned['runtime_nixpkgs_lock_node']
          if node['inputs'].get('nixpkgs') != runtime:
              raise SystemExit('Nixer transitive nixpkgs edge differs from reviewed contract')
          if lock['nodes'][runtime]['locked']['rev'] != pinned['runtime_nixpkgs_required_revision']:
              raise SystemExit('Nixer transitive nixpkgs revision differs from reviewed contract')
          print(revision)
          print(nar_hash)
          PY
          )"
          mapfile -t pin_values <<< "$pins"
          # No narHash= in the upstream reference: Nix obtains bytes by the
          # exact GitHub commit and reports a freshly computed source hash.
          fetched="$(timeout 180s nix flake prefetch --json --refresh --no-write-lock-file "github:heimgewebe/nixer/${pin_values[0]}")"
          remote_fields="$(python3 -c 'import json,sys; value=json.load(sys.stdin); print(value["hash"]); print(value["storePath"])' <<< "$fetched")"
          mapfile -t remote_values <<< "$remote_fields"
          test "${remote_values[0]}" = "${pin_values[1]}"
          case "${remote_values[1]}" in /nix/store/*-source) ;; *) exit 1;; esac
          rehashed="$(nix hash path --type sha256 --sri "${remote_values[1]}")"
          test "$rehashed" = "${pin_values[1]}"
          printf 'NIXER_UPSTREAM_NAR_VERIFIED=%s\n' "${pin_values[1]}"

      - name: Evaluate complete flake without building checks
        run: nix flake check --no-build --no-update-lock-file --print-build-logs

      - name: Prove evaluated Heim-PC contracts
        run: >-
          nix build --no-link --no-update-lock-file --print-out-paths --print-build-logs
          .#checks.x86_64-linux.profile-contract
          .#checks.x86_64-linux.supply-chain-trust
          .#checks.x86_64-linux.nix-lifecycle-contract
          .#checks.x86_64-linux.host-protection-contract
          .#checks.x86_64-linux.recovery-readiness-contract
          .#checks.x86_64-linux.intentional-break-rejected
          .#checks.x86_64-linux.agent-zone-contract

      - name: Record heavy-derivation substitution plan
        run: |
          set -o pipefail
          nix build --dry-run --no-link --no-update-lock-file             .#packages.x86_64-linux.physical-gate-proprietary-system             2>&1 | tee "$RUNNER_TEMP/heim-pc-ci-cache-dry-run.log"
          grep -E 'ollama-0\.32\.3|llama-cpp-9190'             "$RUNNER_TEMP/heim-pc-ci-cache-dry-run.log" || true

      - name: Build storage, VM and physical-gate closures
        run: >-
          nix build --no-link --no-update-lock-file --print-out-paths --print-build-logs
          .#nixosConfigurations.heim-pc-storage-target.config.system.build.toplevel
          .#nixosConfigurations.heim-pc-vm.config.system.build.toplevel
          .#packages.x86_64-linux.physical-gate-proprietary-system
          .#packages.x86_64-linux.physical-gate-open-system

      - name: Build live-gate and inventory ISOs
        run: >-
          nix build --no-link --no-update-lock-file --print-out-paths --print-build-logs
          .#packages.x86_64-linux.physical-gate-live-proprietary-iso
          .#packages.x86_64-linux.physical-gate-live-open-iso
          .#packages.x86_64-linux.physical-gate-live-inventory-iso

      - name: Build no-IP agent-zone closures
        run: >-
          nix build --no-link --no-update-lock-file --print-out-paths --print-build-logs
          .#packages.x86_64-linux.agent-microvm
          .#packages.x86_64-linux.agent-vsock-proof-microvm
          .#packages.x86_64-linux.trust-zone-host-system

      - name: Run scoped VM checks
        run: >-
          nix build --no-link --no-update-lock-file --print-out-paths --print-build-logs
          .#checks.x86_64-linux.integration
          .#checks.x86_64-linux.host-protection
          .#checks.x86_64-linux.firstboot-credentials
          .#checks.x86_64-linux.trust-zones

      - name: Prove untrusted signatures are rejected by substitution
        run: bash scripts/ci/check_nix_cache_signature_rejection.sh