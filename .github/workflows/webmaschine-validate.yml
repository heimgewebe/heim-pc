name: webmaschine-validate

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

env:
  METAREPO_REF: "23a48938d7ac7d739da7cbaa9768d1a8a4d05b91" # Pinned to a specific, verified metarepo commit for reproducibility

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout webmaschine
        uses: actions/checkout@v4
        with:
          path: webmaschine

      - name: Checkout metarepo for contracts
        uses: actions/checkout@v4
        with:
          repository: heimgewebe/metarepo
          path: _metarepo
          ref: ${{ env.METAREPO_REF }}
          fetch-depth: 1
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # working-directory: ./webmaschine is correct here because we want to install from requirements.txt
      # which is located in the checked-out repo root (webmaschine/).
      - name: Install dependencies
        working-directory: ./webmaschine
        run: python3 -m pip install -r requirements.txt

      # Scripts now self-locate relative to __file__, so invoking them from anywhere works
      # as long as the path to the script is correct.
      # Since we are in the workspace root, and repo is in 'webmaschine', we call webmaschine/scripts/...
      - name: Validate Syntax
        run: python3 webmaschine/scripts/validate_syntax.py

      - name: Validate Contracts
        run: python3 webmaschine/scripts/validate_contracts.py

      - name: Check Metadata Freshness
        run: python3 webmaschine/scripts/check_freshness.py
