name: webmaschine-validate

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install jsonschema pyyaml

      - name: Validate YAML
        run: |
          python3 -c "import yaml, glob, sys;
          patterns = ['.github/workflows/*.yml', '.wgx/profile.yml', 'config/*.yml', 'config/**/*.yml'];
          files = [];
          for p in patterns: files.extend(glob.glob(p, recursive=True));

          error = False;
          for f in files:
            try:
              yaml.safe_load(open(f))
            except Exception as e:
              print(f'Error parsing {f}: {e}'); error = True

          if error: sys.exit(1)"

      - name: Validate JSON
        run: |
          python3 -c "import json, glob, sys;
          patterns = ['state/*.json', 'contracts/*.json', 'snapshots/*.summary.json'];
          files = [];
          for p in patterns: files.extend(glob.glob(p, recursive=True));

          error = False;
          for f in files:
            try:
              json.load(open(f))
            except Exception as e:
              print(f'Error parsing {f}: {e}'); error = True

          if error: sys.exit(1)"

      - name: Validate Zones Config
        run: |
          python3 -c "
          import yaml
          import json
          import sys
          from jsonschema import validate, ValidationError

          try:
              with open('config/zones.yml', 'r') as df:
                  data = yaml.safe_load(df)
              with open('config/zones.schema.yml', 'r') as sf:
                  # The schema is YAML, but jsonschema expects a JSON object
                  schema = yaml.safe_load(sf)

              print('Validating config/zones.yml against config/zones.schema.yml...')
              validate(instance=data, schema=schema)
              print('OK: config/zones.yml')
          except ValidationError as e:
              print(f'Validation Error in config/zones.yml: {e.message}')
              sys.exit(1)
          except Exception as e:
              print(f'Error processing config/zones.yml: {e}')
              sys.exit(1)
          "

      - name: Validate Contracts
        run: |
          python3 -c "
          import json
          import sys
          import os
          from jsonschema import validate, ValidationError

          def validate_file(data_file, schema_file):
              if not os.path.exists(data_file):
                  print(f'Skipping {data_file} (not found)')
                  return True
              if not os.path.exists(schema_file):
                  print(f'Schema {schema_file} not found for {data_file}')
                  return False

              print(f'Validating {data_file} against {schema_file}...')
              try:
                  with open(data_file, 'r') as df:
                      data = json.load(df)
                  with open(schema_file, 'r') as sf:
                      schema = json.load(sf)
                  validate(instance=data, schema=schema)
                  print(f'OK: {data_file}')
                  return True
              except ValidationError as e:
                  print(f'Validation Error in {data_file}: {e.message}')
                  return False
              except Exception as e:
                  print(f'Error processing {data_file}: {e}')
                  return False

          files_to_validate = [
              ('state/index.json', 'contracts/webmaschine.state.index.schema.json'),
              ('state/repos.json', 'contracts/webmaschine.state.repos.schema.json'),
              ('state/uncertainties.json', 'contracts/webmaschine.state.uncertainties.schema.json'),
              ('state/insights.json', 'contracts/webmaschine.state.insights.schema.json'),
              ('state/drift.json', 'contracts/webmaschine.state.drift.schema.json')
          ]

          success = True
          for data_f, schema_f in files_to_validate:
              if not validate_file(data_f, schema_f):
                  success = False

          if not success:
              sys.exit(1)
          "

      - name: Check Metadata Placeholder and Freshness
        run: |
          python3 -c "
          import json
          import sys
          from datetime import datetime, timedelta, timezone

          try:
              with open('state/index.json', 'r') as f:
                  data = json.load(f)

              last_updated_str = data.get('metadata', {}).get('last_updated')

              if last_updated_str is None:
                  print('::warning::metadata.last_updated is null (Placeholder data detected)')
              else:
                  print(f'Last updated: {last_updated_str}')
                  # Defensively parse ISO 8601 timestamps, handling 'Z' suffix for older Python versions
                  if last_updated_str.endswith("Z"):
                      last_updated_str = last_updated_str[:-1] + "+00:00"

                  last_updated_dt = datetime.fromisoformat(last_updated_str)

                  if last_updated_dt.tzinfo is None:
                      last_updated_dt = last_updated_dt.replace(tzinfo=timezone.utc)

                  if datetime.now(timezone.utc) - last_updated_dt > timedelta(days=7):
                      print('::warning::Stale data detected. The last update was more than 7 days ago.')
          except FileNotFoundError:
              print('::error::state/index.json not found.')
              sys.exit(1)
          except json.JSONDecodeError:
              print('::error::Could not decode state/index.json.')
              sys.exit(1)
          except Exception as e:
              print(f'::error::An unexpected error occurred: {e}')
              sys.exit(1)
          "
