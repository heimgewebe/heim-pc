name: heim-pc-nix-cache-publish

on:
  workflow_run:
    workflows: [ heim-pc-nix ]
    types: [ completed ]

permissions:
  contents: read

env:
  CI_NIX_CACHE_URL: https://commonserver.tail6dbb90.ts.net:10000/nix-cache
  CI_NIX_CACHE_PUBLIC_KEY: heim-pc-ci-cache-20260923-1:fDffoLuvBMGVo8JKRR7uY7EmJPawIsKXuB5OBswBdIo=
  CI_NIX_CACHE_KEY_NAME: heim-pc-ci-cache-20260923-1
  EXPECTED_OLLAMA_DRV_SUFFIX: -ollama-0.32.3.drv
  EXPECTED_LLAMA_CPP_DRV_SUFFIX: -llama-cpp-9190.drv

jobs:
  publish:
    if: >-
      vars.CI_NIX_CACHE_PUBLISH_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.workflow_id == 351684660 &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ci-cache-publisher
    env:
      EXPECTED_SOURCE_REVISION: ${{ github.event.workflow_run.head_sha }}
      SOURCE_EVENT: ${{ github.event.workflow_run.event }}
      SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
      SOURCE_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
      SOURCE_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
      # Separate protected opt-in; default heavy-only publication is unchanged.
      PUBLISH_SYSTEM_CLOSURE: ${{ vars.CI_NIX_CACHE_PUBLISH_SYSTEM_CLOSURE_ENABLED }}
    steps:
      - name: Checkout exact successful Main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify publisher source identity
        run: |
          set -euo pipefail
          test "$SOURCE_EVENT" = "push"
          test "$SOURCE_BRANCH" = "main"
          test "$SOURCE_WORKFLOW_ID" = "351684660"
          test "$SOURCE_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_REVISION"
          test -z "$(git status --porcelain)"
          printf 'PUBLISH_SOURCE_REVISION=%s\n' "$EXPECTED_SOURCE_REVISION"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            require-sigs = true
            fallback = true
            extra-substituters = https://commonserver.tail6dbb90.ts.net:10000/nix-cache
            extra-trusted-public-keys = heim-pc-ci-cache-20260923-1:fDffoLuvBMGVo8JKRR7uY7EmJPawIsKXuB5OBswBdIo=

      - name: Resolve exact heavy derivations from Main graph
        id: heavy
        run: |
          set -euo pipefail
          graph="$RUNNER_TEMP/physical-gate-derivations.json"
          nix derivation show --recursive             .#packages.x86_64-linux.physical-gate-proprietary-system > "$graph"

          mapfile -t ollama_drvs < <(
            jq -r --arg suffix "$EXPECTED_OLLAMA_DRV_SUFFIX"               '.derivations | keys[] | select(endswith($suffix))' "$graph"
          )
          mapfile -t llama_drvs < <(
            jq -r --arg suffix "$EXPECTED_LLAMA_CPP_DRV_SUFFIX"               '.derivations | keys[] | select(endswith($suffix))' "$graph"
          )
          test "${#ollama_drvs[@]}" -eq 1
          test "${#llama_drvs[@]}" -eq 1

          ollama_drv_key="${ollama_drvs[0]}"
          llama_drv_key="${llama_drvs[0]}"
          ollama_path="$(jq -r --arg drv "$ollama_drv_key" '.derivations[$drv].outputs.out.path' "$graph")"
          llama_path="$(jq -r --arg drv "$llama_drv_key" '.derivations[$drv].outputs.out.path' "$graph")"
          case "$ollama_drv_key" in /*) ollama_drv="$ollama_drv_key" ;; *) ollama_drv="/nix/store/$ollama_drv_key" ;; esac
          case "$llama_drv_key" in /*) llama_drv="$llama_drv_key" ;; *) llama_drv="/nix/store/$llama_drv_key" ;; esac
          case "$ollama_path" in /*) ;; *) ollama_path="/nix/store/$ollama_path" ;; esac
          case "$llama_path" in /*) ;; *) llama_path="/nix/store/$llama_path" ;; esac

          nix build --no-link --no-update-lock-file --print-build-logs             "$ollama_drv^out" "$llama_drv^out"

          test -e "$ollama_path"
          test -e "$llama_path"
          printf 'OLLAMA_DRV=%s\n' "$ollama_drv"
          printf 'OLLAMA_PATH=%s\n' "$ollama_path"
          printf 'LLAMA_CPP_DRV=%s\n' "$llama_drv"
          printf 'LLAMA_CPP_PATH=%s\n' "$llama_path"
          printf 'ollama_path=%s\n' "$ollama_path" >> "$GITHUB_OUTPUT"
          printf 'llama_path=%s\n' "$llama_path" >> "$GITHUB_OUTPUT"

          # Publishing the complete installation closure is not authorized by
          # an existing heavy-cache opt-in alone.
          case "$PUBLISH_SYSTEM_CLOSURE" in
            ""|false) ;;
            true)
              expected_system_path="$(nix eval --raw --no-update-lock-file \
                .#nixosConfigurations.heim-pc-storage-target.config.system.build.toplevel.outPath)"
              system_path="$(nix build --no-link --no-update-lock-file --print-out-paths --print-build-logs \
                .#packages.x86_64-linux.heim-pc-storage-target-system)"
              test "$system_path" = "$expected_system_path"
              if [[ ! "$system_path" =~ ^/nix/store/[0-9a-z]{32}-nixos-system-heim-pc-[A-Za-z0-9._+-]+$ ]]; then
                echo 'refusing system closure publication: wrong system store path' >&2
                exit 1
              fi
              test -d "$system_path"
              printf 'system_path=%s\n' "$system_path" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo 'refusing system closure publication: unexpected opt-in value' >&2
              exit 1
              ;;
          esac

      - name: Create signed append-only cache payload
        env:
          SIGNING_KEY_B64: ${{ secrets.CI_CACHE_NIX_SIGNING_KEY_B64 }}
          OLLAMA_PATH: ${{ steps.heavy.outputs.ollama_path }}
          LLAMA_CPP_PATH: ${{ steps.heavy.outputs.llama_path }}
          SYSTEM_PATH: ${{ steps.heavy.outputs.system_path }}
        run: |
          set -euo pipefail
          cache_dir="$RUNNER_TEMP/ci-nix-cache"
          signing_key="$RUNNER_TEMP/ci-nix-cache-signing-key"
          trap 'rm -f "$signing_key"' EXIT
          mkdir -p "$cache_dir"
          printf '%s' "$SIGNING_KEY_B64" | base64 --decode > "$signing_key"
          chmod 600 "$signing_key"

          # Require the exact public key trusted by CI consumers, not only its name.
          derived_public_key="$(nix key convert-secret-to-public < "$signing_key")"
          if [[ "$derived_public_key" != "$CI_NIX_CACHE_PUBLIC_KEY" ]]; then
            echo "Cache signing key does not match the trusted CI public key; refusing publication" >&2
            exit 1
          fi

          publication_paths=( "$OLLAMA_PATH" "$LLAMA_CPP_PATH" )
          case "$PUBLISH_SYSTEM_CLOSURE" in
            ""|false)
              test -z "$SYSTEM_PATH"
              ;;
            true)
              if [[ ! "$SYSTEM_PATH" =~ ^/nix/store/[0-9a-z]{32}-nixos-system-heim-pc-[A-Za-z0-9._+-]+$ ]]; then
                echo 'refusing system closure publication: unsigned or invalid system output' >&2
                exit 1
              fi
              test -d "$SYSTEM_PATH"
              publication_paths+=( "$SYSTEM_PATH" )
              ;;
            *)
              echo 'refusing system closure publication: invalid opt-in mode' >&2
              exit 1
              ;;
          esac
          nix copy \
            --to "file://$cache_dir?secret-key=$signing_key" \
            "${publication_paths[@]}"

          test -f "$cache_dir/nix-cache-info"
          for store_path in "${publication_paths[@]}"; do
            base="$(basename "$store_path")"
            hash="${base%%-*}"
            narinfo="$cache_dir/$hash.narinfo"
            test -f "$narinfo"
            grep -Fqx "StorePath: $store_path" "$narinfo"
            grep -q "^Sig: $CI_NIX_CACHE_KEY_NAME:" "$narinfo"
          done

      - name: Upload cache through restricted publisher key
        env:
          UPLOAD_KEY_B64: ${{ secrets.CI_CACHE_UPLOAD_SSH_KEY_B64 }}
          CI_NIX_CACHE_SSH_HOST: ${{ secrets.CI_CACHE_UPLOAD_SSH_HOST }}
          CI_NIX_CACHE_SSH_HOST_KEY: ${{ secrets.CI_CACHE_UPLOAD_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          cache_dir="$RUNNER_TEMP/ci-nix-cache"
          upload_key="$RUNNER_TEMP/ci-nix-cache-upload-key"
          known_hosts="$RUNNER_TEMP/ci-nix-cache-known-hosts"
          trap 'rm -f "$upload_key" "$known_hosts"' EXIT
          printf '%s' "$UPLOAD_KEY_B64" | base64 --decode > "$upload_key"
          chmod 600 "$upload_key"
          test -n "$CI_NIX_CACHE_SSH_HOST"
          test -n "$CI_NIX_CACHE_SSH_HOST_KEY"
          printf '%s %s\n' "$CI_NIX_CACHE_SSH_HOST" "$CI_NIX_CACHE_SSH_HOST_KEY" > "$known_hosts"
          chmod 600 "$known_hosts"

          # A successful signed narinfo advertises the associated NAR as
          # fetchable. Publish *all* payloads first, never a dangling narinfo.
          # rsync stages each file under a temporary name before renaming it;
          # --ignore-existing forbids overwriting previously published bytes.
          rsync -r --ignore-existing --exclude='*.narinfo' \
            -e "ssh -i $upload_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts" \
            "$cache_dir/" "alex@$CI_NIX_CACHE_SSH_HOST:/"

          # The restricted rrsync -no-overwrite receiver forces
          # --ignore-existing even on a checksum dry-run. That makes a
          # receiver-side rsync audit blind to stale or truncated NARs.
          # Instead, read back every NAR through the existing HTTPS cache
          # endpoint and compare *all bytes* to the freshly signed local
          # payload before publishing any signed narinfo metadata.
          # This never needs broader SSH publisher authority or remote writes.
          shopt -s nullglob
          nar_files=( "$cache_dir"/nar/* )
          if (( ${#nar_files[@]} == 0 )); then
            echo 'no generated NAR payloads; refusing narinfo publication' >&2
            exit 1
          fi
          for nar_file in "${nar_files[@]}"; do
            if [[ ! -f "$nar_file" || -L "$nar_file" ]]; then
              echo 'unsafe NAR payload entry; refusing narinfo publication' >&2
              exit 1
            fi
            nar_name="${nar_file##*/}"
            if [[ ! "$nar_name" =~ ^[A-Za-z0-9_-]+\.nar(\.(xz|zst|gz|bz2|lz4))?$ ]]; then
              echo 'unexpected NAR payload filename; refusing narinfo publication' >&2
              exit 1
            fi
            if ! curl --fail --silent --show-error --connect-timeout 15 --max-time 900 --proto '=https' \
              "$CI_NIX_CACHE_URL/nar/$nar_name" | cmp -s -- "$nar_file" -; then
              echo 'remote NAR payload does not match signed local bytes; refusing narinfo publication' >&2
              exit 1
            fi
          done

          # A signed narinfo can already exist in the append-only receiver.
          # rrsync -no-overwrite silently retains that older metadata, even
          # when this run produced a different but validly signed NAR. Do not
          # mistake signature validity and equal store paths for equal bytes.
          narinfo_files=( "$cache_dir"/*.narinfo )
          if (( ${#narinfo_files[@]} == 0 )); then
            echo 'no generated signed narinfo; refusing publication' >&2
            exit 1
          fi
          narinfo_before="$(mktemp "$RUNNER_TEMP/ci-nix-cache-narinfo-before.XXXXXX")"
          trap 'rm -f "$upload_key" "$known_hosts" "$narinfo_before"' EXIT
          for narinfo_file in "${narinfo_files[@]}"; do
            if [[ ! -f "$narinfo_file" || -L "$narinfo_file" ]]; then
              echo 'unsafe narinfo entry; refusing publication' >&2
              exit 1
            fi
            narinfo_name="${narinfo_file##*/}"
            if [[ ! "$narinfo_name" =~ ^[A-Za-z0-9_-]+\.narinfo$ ]]; then
              echo 'invalid narinfo filename; refusing publication' >&2
              exit 1
            fi
            # Existing objects must match the exact signed local metadata.
            # 404 is the only acceptable absence; redirects and server errors
            # are not silently interpreted as a cache miss.
            if ! status="$(curl --silent --show-error --connect-timeout 15 --max-time 900 --proto '=https' \
              --output "$narinfo_before" --write-out '%{http_code}' \
              "$CI_NIX_CACHE_URL/$narinfo_name")"; then
              echo 'remote narinfo readback failed; refusing publication' >&2
              exit 1
            fi
            case "$status" in
              200)
                if ! cmp -s -- "$narinfo_file" "$narinfo_before"; then
                  echo 'pre-existing signed narinfo differs from local bytes; refusing publication' >&2
                  exit 1
                fi
                ;;
              404) ;; # Genuine new object: append-only upload may create it.
              *)
                echo 'unexpected remote narinfo HTTP status; refusing publication' >&2
                exit 1
                ;;
            esac
          done

          # All payloads match the consumer endpoint and no existing
          # signed metadata conflicts. Only now publish missing metadata.
          rsync -r --ignore-existing --include='*.narinfo' --exclude='*' \
            -e "ssh -i $upload_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts" \
            "$cache_dir/" "alex@$CI_NIX_CACHE_SSH_HOST:/"

          # Catch a concurrent creator racing between the 404 preflight and
          # the forced --ignore-existing upload, as well as failed visibility.
          # Later closure verification alone would accept an older, validly
          # signed but different NAR under an identical store path.
          for narinfo_file in "${narinfo_files[@]}"; do
            narinfo_name="${narinfo_file##*/}"
            if ! curl --fail --silent --show-error --connect-timeout 15 --max-time 900 --proto '=https' \
              "$CI_NIX_CACHE_URL/$narinfo_name" | cmp -s -- "$narinfo_file" -; then
              echo 'published signed narinfo differs from local bytes; refusing success' >&2
              exit 1
            fi
          done

      - name: Verify public signed-cache readback
        env:
          OLLAMA_PATH: ${{ steps.heavy.outputs.ollama_path }}
          LLAMA_CPP_PATH: ${{ steps.heavy.outputs.llama_path }}
          SYSTEM_PATH: ${{ steps.heavy.outputs.system_path }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$CI_NIX_CACHE_URL/nix-cache-info" >/dev/null

          # Download the entire closure from the published remote cache to a
          # fresh, empty binary cache. Never trust runner-local dependencies.
          export NIX_CONFIG="experimental-features = nix-command flakes
          require-sigs = true
          substituters = $CI_NIX_CACHE_URL
          trusted-public-keys = $CI_NIX_CACHE_PUBLIC_KEY
          fallback = false
          # Heavy builds may have cached a pre-upload miss from this substituter.
          narinfo-cache-negative-ttl = 0
          max-jobs = 0"

          closure_paths=( "$OLLAMA_PATH" "$LLAMA_CPP_PATH" )
          case "$PUBLISH_SYSTEM_CLOSURE" in
            ""|false)
              test -z "$SYSTEM_PATH"
              ;;
            true)
              if [[ ! "$SYSTEM_PATH" =~ ^/nix/store/[0-9a-z]{32}-nixos-system-heim-pc-[A-Za-z0-9._+-]+$ ]]; then
                echo 'invalid system path at independent consumer readback' >&2
                exit 1
              fi
              closure_paths+=( "$SYSTEM_PATH" )
              ;;
            *)
              echo 'invalid system opt-in at independent consumer readback' >&2
              exit 1
              ;;
          esac

          readback_cache_dir="$RUNNER_TEMP/ci-nix-cache-remote-readback"
          test ! -e "$readback_cache_dir"
          mkdir -m 0700 "$readback_cache_dir"

          expected_closure="$RUNNER_TEMP/ci-nix-cache-expected-closure.txt"
          remote_closure="$RUNNER_TEMP/ci-nix-cache-remote-closure.txt"
          nix path-info --recursive "${closure_paths[@]}" |
            LC_ALL=C sort -u > "$expected_closure"
          test -s "$expected_closure"

          # --from is explicit: a local /nix/store hit cannot mask remote corruption.
          # --to starts empty: every closure NAR must be fetched and validated.
          nix copy --from "$CI_NIX_CACHE_URL" --to "file://$readback_cache_dir" \
            "${closure_paths[@]}"

          # Cache-to-cache copy alone accepts untrusted NAR signatures. Verify
          # both contents and trusted signing keys across every closure path.
          nix store verify --store "file://$readback_cache_dir" --recursive \
            "${closure_paths[@]}"

          nix path-info --recursive --store "file://$readback_cache_dir" \
            "${closure_paths[@]}" |
            LC_ALL=C sort -u > "$remote_closure"
          test -s "$remote_closure"
          cmp -s "$expected_closure" "$remote_closure"

          for store_path in "${closure_paths[@]}"; do
            grep -Fqx -- "$store_path" "$remote_closure"
            printf 'PUBLISHED_TRUSTED_CLOSURE=%s\n' "$store_path"
          done
          if [[ "$PUBLISH_SYSTEM_CLOSURE" == "true" ]]; then
            printf 'PUBLISHED_TRUSTED_SYSTEM_CLOSURE=%s\n' "$SYSTEM_PATH"
          fi
          printf 'PUBLISHED_TRUSTED_CLOSURE_PATHS=%s\n' "$(wc -l < "$remote_closure")"
