name: wgx-guard

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout WGX Tooling
        uses: actions/checkout@v4
        with:
          repository: heimgewebe/wgx
          path: .wgx-tooling

      - name: Setup WGX
        run: |
          chmod +x .wgx-tooling/cli/wgx
          echo "${PWD}/.wgx-tooling/cli" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          pip install yamllint
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          chmod +x ./actionlint || true
          echo "${PWD}" >> $GITHUB_PATH

      - name: Verify WGX Profile
        run: wgx tasks --json --safe || true

      - name: Run WGX Guard
        run: wgx task guard
