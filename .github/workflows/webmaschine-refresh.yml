name: Webmaschine Refresh

on:
  workflow_dispatch:
    inputs:
      include_snapshot:
        description: 'Include full filesystem snapshot as artifact'
        required: false
        default: 'false'
        type: boolean
  
  # Optional: Uncomment to enable scheduled refresh
  # schedule:
  #   - cron: '0 4 * * *'  # Daily at 04:00 UTC

jobs:
  refresh:
    name: Refresh Webmaschine Data
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install pyyaml
      
      - name: Update timestamp in state files
        run: |
          timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          # Update index.json
          python3 << EOF
          import json
          with open('state/index.json', 'r') as f:
              data = json.load(f)
          data['metadata']['last_updated'] = '$timestamp'
          with open('state/index.json', 'w') as f:
              json.dump(data, f, indent=2)
          EOF
          
          # Update summary.md
          sed -i "s/Last Updated: .*/Last Updated: $timestamp/" state/summary.md
          
          echo "Updated timestamps to $timestamp"
      
      - name: Generate mock snapshot summary
        run: |
          timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          python3 << 'EOF'
          import json
          from datetime import datetime
          
          summary = {
            "summary": {
              "total_files": 0,
              "total_directories": 0,
              "total_size_bytes": 0,
              "by_zone": {},
              "by_type": {}
            },
            "top_directories": [],
            "large_files": [],
            "metadata": {
              "snapshot_time": datetime.utcnow().isoformat() + "Z",
              "scan_duration_ms": 0,
              "version": "1.0"
            }
          }
          
          with open('snapshots/latest.fs.summary.json', 'w') as f:
            json.dump(summary, f, indent=2)
          
          print("Generated snapshot summary")
          EOF
      
      - name: Create mock full snapshot artifact
        if: inputs.include_snapshot == 'true' || github.event_name == 'schedule'
        run: |
          mkdir -p /tmp/snapshot
          
          cat > /tmp/snapshot/fs.snapshot.full.json << 'EOF'
          {
            "version": "1.0",
            "timestamp": "placeholder",
            "files": [],
            "directories": [],
            "repositories": [],
            "metadata": {
              "note": "This is a placeholder. Real implementation would scan the filesystem."
            }
          }
          EOF
          
          echo "Created mock full snapshot"
      
      - name: Upload snapshot artifact
        if: inputs.include_snapshot == 'true' || github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: fs-snapshot-latest
          path: /tmp/snapshot/fs.snapshot.full.json
          retention-days: 90
      
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add state/ snapshots/
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh webmaschine data [skip ci]"
            git push
          fi
