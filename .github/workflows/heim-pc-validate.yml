name: heim-pc-validate

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

env:
  METAREPO_REF: "23a48938d7ac7d739da7cbaa9768d1a8a4d05b91" # Pinned to a specific, verified metarepo commit for reproducibility

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout heim-pc
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: heim-pc

      - name: Checkout metarepo for contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: heimgewebe/metarepo
          path: _metarepo
          ref: ${{ env.METAREPO_REF }}
          fetch-depth: 1
      
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'

      # working-directory: ./heim-pc is correct here because we want to install from requirements.txt
      # which is located in the checked-out repo root (heim-pc/).
      - name: Install dependencies
        working-directory: ./heim-pc
        run: python3 -m pip install -r requirements.txt

      - name: Verify scripts syntax
        run: python3 -m compileall -q heim-pc/scripts

      - name: Run test suite
        working-directory: ./heim-pc
        run: python3 -m pytest -q

      - name: Validate canonical operator entry
        working-directory: ./heim-pc
        run: python3 scripts/check_operator_entry.py

      # Scripts now self-locate relative to __file__, so invoking them from anywhere works
      # as long as the path to the script is correct.
      # Since we are in the workspace root, and repo is in 'heim-pc', we call heim-pc/scripts/...
      - name: Smoke-run validate_syntax
        working-directory: ./heim-pc
        run: python3 scripts/validate_syntax.py

      - name: Smoke-run validate_contracts
        working-directory: ./heim-pc
        run: python3 scripts/validate_contracts.py

      - name: Check repo-index consistency
        working-directory: ./heim-pc
        run: python3 scripts/ci/check_repo_index_consistency.py

      - name: Check document review age
        working-directory: ./heim-pc
        run: python3 scripts/ci/check-doc-review-age.py

      - name: Ensure SYSTEM_MAP.md is up to date
        working-directory: ./heim-pc
        run: |
          python3 scripts/generate-system-map.py
          git diff --exit-code SYSTEM_MAP.md
