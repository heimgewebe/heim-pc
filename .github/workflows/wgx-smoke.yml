name: wgx-smoke

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Checkout WGX Tooling
        uses: actions/checkout@v7
        with:
          repository: heimgewebe/wgx
          path: .wgx-tooling

      - name: Setup WGX
        run: |
          chmod +x .wgx-tooling/cli/wgx
          echo "${PWD}/.wgx-tooling/cli" >> $GITHUB_PATH

      - name: Verify WGX Profile
        run: wgx tasks --json --safe || true

      - name: Run WGX Smoke
        run: wgx task smoke
