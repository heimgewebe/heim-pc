[Service]
Environment="DISPLAY=:0" "WAYLAND_DISPLAY=wayland-0" "XDG_SESSION_TYPE=wayland" "QT_QPA_PLATFORM=wayland" "KRDP_EMBED_CURSOR=1" "KRDP_RDPEI_TOUCH=1" "XDG_RUNTIME_DIR=/run/user/1000" "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus"
Environment="KRDP_INPUT_DIAG=1"
ExecCondition=/run/current-system/sw/bin/test -S /run/user/1000/wayland-0
ExecStartPre=/run/current-system/sw/bin/install -Dm755 /nix/store/zd0w8091nc839xdnm14yg8ax8dd6y9hk-krdp-6.7.0/bin/.krdpserver-wrapped /run/user/1000/krdp-ipad-native-v13/krdpserver
ExecStartPre=/run/current-system/sw/bin/kbuildsycoca6 --noincremental
ExecStartPre=-/run/current-system/sw/bin/busctl --user call org.kde.KWin /KWin org.kde.KWin reconfigure
ExecStartPre=/run/user/1000/krdp-ipad-native-v13/krdpserver --help
ExecStart=
ExecStart=/run/user/1000/krdp-ipad-native-v13/krdpserver --address 127.0.0.1 --port 3390 --monitor-name DP-2 --plasma
TimeoutStopSec=15s