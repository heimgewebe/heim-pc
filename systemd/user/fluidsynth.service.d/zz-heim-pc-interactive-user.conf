# Keep the globally enabled distribution unit scoped to the primary interactive user.
# Supervise the legacy FluidSynth build through its stdin shell instead of exposing TCP port 9800.
[Unit]
ConditionUser=
ConditionUser=alex

[Service]
Type=simple
NotifyAccess=main
ExecStart=
ExecStart=/usr/bin/env SDL_NO_SIGNAL_HANDLERS=1 /usr/local/libexec/heim-pc/fluidsynth-supervisor -- /usr/bin/fluidsynth -q $OTHER_OPTS $SOUND_FONT
ExecStop=
KillMode=mixed
KillSignal=SIGTERM
RestartKillSignal=SIGTERM
TimeoutStopSec=15s
SendSIGKILL=yes
FinalKillSignal=SIGKILL
LogRateLimitIntervalSec=30s
LogRateLimitBurst=200
