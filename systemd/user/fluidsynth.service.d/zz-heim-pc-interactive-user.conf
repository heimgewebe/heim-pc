# Keep the globally enabled distribution unit scoped to the primary interactive user.
# Restore the distribution no-shell server contract after any earlier user drop-in.
[Unit]
ConditionUser=
ConditionUser=alex

[Service]
Type=notify
NotifyAccess=main
ExecStart=
ExecStart=/usr/bin/fluidsynth -is $OTHER_OPTS $SOUND_FONT
LogRateLimitIntervalSec=30s
LogRateLimitBurst=200
