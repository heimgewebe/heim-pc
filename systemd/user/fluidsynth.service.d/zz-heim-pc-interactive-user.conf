# Keep the globally enabled distribution unit scoped to the primary interactive user.
# Preserve the distribution FluidSynth argv without a shell after earlier drop-ins.
[Unit]
ConditionUser=
ConditionUser=alex

[Service]
Type=notify
NotifyAccess=main
ExecStart=
ExecStart=/usr/bin/env SDL_NO_SIGNAL_HANDLERS=1 /usr/bin/fluidsynth -is $OTHER_OPTS $SOUND_FONT
ExecStop=
KillMode=control-group
KillSignal=SIGTERM
RestartKillSignal=SIGTERM
TimeoutStopSec=15s
SendSIGKILL=yes
FinalKillSignal=SIGKILL
LogRateLimitIntervalSec=30s
LogRateLimitBurst=200
