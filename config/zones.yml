# config/zones.yml
# Defines semantic zones within the filesystem.
# This file is validated against the canonical schema in heimgewebe/metarepo.

zones:
  - name: "core-projects"
    # User must fill this manually. Example: ["/home/user/dev/projects"]
    paths: []
    purpose: "Contains primary development projects and active repositories."
    tags:
      - "development"
      - "high-priority"
    review_frequency: "monthly"

  - name: "archives"
    # User must fill this manually. Example: ["/mnt/nas/archive"]
    paths: []
    purpose: "Long-term storage for completed or inactive projects."
    tags:
      - "archive"
      - "low-priority"
    review_frequency: "yearly"
