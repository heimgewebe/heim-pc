# config/zones.schema.yml
# Defines the structure for zones.yml to provide semantic context for AI agents.

$schema: http://json-schema.org/draft-07/schema#
$id: https://heimgewebe.dev/schemas/webmaschine/config/zones/v1.0.json
title: Webmaschine Zones Configuration
description: >-
  Schema for defining semantic zones within the filesystem, including their
  purpose, tags, and review cadences.

type: object
required:
  - zones
properties:
  zones:
    type: array
    description: A list of semantic filesystem zones.
    items:
      type: object
      required:
        - name
        - paths
        - purpose
        - tags
        - review_frequency
      properties:
        name:
          type: string
          description: A unique identifier for the zone (e.g., 'core-projects', 'media-archives').
        paths:
          type: array
          description: A list of absolute paths that belong to this zone.
          items:
            type: string
        purpose:
          type: string
          description: A human-readable description of what this zone is for.
        tags:
          type: array
          description: >-
            Semantic tags that help the AI understand the nature of the content
            (e.g., 'development', 'archive', 'assets', 'temporary').
          items:
            type: string
        review_frequency:
          type: string
          description: >-
            A suggested cadence for reviewing the contents of this zone.
          enum:
            - "weekly"
            - "monthly"
            - "quarterly"
            - "yearly"
            - "never"
