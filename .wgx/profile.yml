wgx:
  version: "1.0"

tasks:
  guard:
    enabled: true
    steps:
      - id: yaml-lint
        run: yamllint
        files: ["**/*.yml", "**/*.yaml"]
      - id: json-lint
        run: python3 -m json.tool
        files: ["**/*.json"]
      - id: actionlint
        run: actionlint
        files: [".github/workflows/*.yml"]

  smoke:
    enabled: true
    steps:
      - id: state-readable
        run: python3 -c "import json; json.load(open('state/index.json'))"
