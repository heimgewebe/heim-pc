wgx:
  version: "1.0"

tasks:
  guard:
    enabled: true
    steps:
      - id: yaml-lint
        run: yamllint
        files:
          - ".github/**/*.yml"
          - ".github/**/*.yaml"
          - ".wgx/**/*.yml"
          - ".wgx/**/*.yaml"
          - "config/**/*.yml"
          - "config/**/*.yaml"
      - id: json-lint
        run: python3 -m json.tool
        files:
          - "state/**/*.json"
          - "contracts/**/*.json"
          - "snapshots/**/*.json"
      - id: actionlint
        run: actionlint
        files: [".github/workflows/*.yml"]

  smoke:
    enabled: true
    steps:
      - id: state-readable
        run: python3 -c "import json; json.load(open('state/index.json'))"
